name: Deploy Maintenance Report

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build website
        env:
          VITE_SUPABASE_URL: https://hftlogubohbjiivcvkut.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_FtRkkKGWJpOakcv69BX-Hw_RHFCD86n
          VITE_EMPLOYEE_LOGIN_FUNCTION: employee-code-login
          VITE_ADMIN_LOGIN_FUNCTION: admin-login
          VITE_USER_ADMIN_FUNCTION: mvr-user-admin
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
